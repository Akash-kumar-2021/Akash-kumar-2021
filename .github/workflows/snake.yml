name: Generate profile visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF5A1F&color_dots=#171717,#3D2418,#7A3417,#C2461B,#FF5A1F
            dist/snake-light.svg?color_snake=#E0480F&color_dots=#EBEDF0,#FFD9C7,#FFA77D,#FF7A3D,#E0480F

      - name: Collect outputs
        run: |
          mkdir -p site
          cp dist/*.svg site/
          cp profile-3d-contrib/profile-3d.svg site/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
